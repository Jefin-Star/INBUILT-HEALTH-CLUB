       C 225 315, 260 325, 300 325
       C 340 325, 375 315, 385 285
       C 390 270, 385 258, 375 250
       C 355 235, 340 220, 335 195
       C 320 205, 310 210, 300 210
       C 290 210, 280 205, 265 195 Z"
    fill="#000000"
  />

