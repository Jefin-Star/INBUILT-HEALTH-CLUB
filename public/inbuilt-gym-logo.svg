  />

  <!-- Black Horizontal Divider Band for "INBUILT" -->
  <rect x="70" y="315" width="460" height="96" fill="#000000" />

  <!-- Lower Green Crescent Ring Border -->
  <path
    d="M 140 380
       C 155 470, 220 535, 300 535
       C 380 535, 445 470, 460 380
       L 435 380
       C 422 455, 368 510, 300 510
       C 232 510, 178 455, 165 380
