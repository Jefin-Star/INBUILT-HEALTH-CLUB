       C 390 180, 445 205, 470 245
       C 485 270, 480 305, 465 330
       C 450 355, 420 370, 395 365
       C 410 395, 415 440, 390 475
       C 360 465, 335 440, 310 435
       C 305 435, 295 435, 290 435
       C 265 440, 240 465, 210 475
       C 185 440, 190 395, 205 365
       C 180 370, 150 355, 135 330
       C 120 305, 115 270, 130 245
       C 155 205, 210 180, 252 185
       C 245 170, 240 152, 240 135
       C 240 85, 265 40, 300 40 Z"
    fill="#00E659"
  />

  <!-- Inner Black Silhouette Cutouts defining Muscular Traps, Delts, and Pecs -->
  <!-- Left Shoulder / Arm Muscle Mass -->
  <path
    d="M 235 200
       C 195 205, 155 228, 142 260
       C 132 282, 138 310, 150 325
       C 162 338, 185 348, 205 338
       C 190 310, 195 270, 215 240
       C 225 225, 230 215, 235 200 Z"
